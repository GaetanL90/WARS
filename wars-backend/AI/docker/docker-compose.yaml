services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  postgres:
    image: postgres:16
    container_name: wars-postgres
    restart: always
    environment:
      POSTGRES_USER: wars
      POSTGRES_PASSWORD: wars@123
      POSTGRES_DB: wars_db
    ports:
      - "5432:5432"
    volumes:
      - wars_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: wars_api
    depends_on:
      - kafka
      - postgres
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://wars:wars@123@postgres:5432/wars_db
      KAFKA_BROKER: kafka:9092
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
volumes:
  wars_pgdata:
