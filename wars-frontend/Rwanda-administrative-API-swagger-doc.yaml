# Common Query Examples
x-examples:
  get_eastern_province_districts:
    description: Get all districts in Eastern Province
    request:
      method: GET
      url: /api/districts/?province=21
    response_count: 7
  
  search_villages:
    description: Search for villages containing "Kigali"
    request:
      method: GET
      url: /api/villages/?search=Kigali
  
  paginated_sectors:
    description: Get second page of sectors with 50 items per page
    request:
      method: GET
      url: /api/sectors/?page=2&page_size=50