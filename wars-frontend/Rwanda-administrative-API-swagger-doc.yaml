openapi: 3.0.0
info:
  title: WARS Administrative API
  description: |
    Rwanda Administrative Structure API providing hierarchical location data from Country to Village level.
    
    ## Features
    - Complete administrative hierarchy (Country → Province → District → Sector → Cell → Village)
    - Filtering, searching, and pagination support
    - 17,440 total records available
    - Production-ready REST API
    
  version: 1.0.0
  contact:
    name: iTechnology Development Team
  license:
    name: Proprietary

servers:
  - url: https://rwanda-administrative-structure-api.onrender.com
    description: Production Server
  - url: http://localhost:8000
    description: Local Development Server

tags:
  - name: Countries
    description: Country-level operations
  - name: Provinces
    description: Province-level operations
  - name: Districts
    description: District-level operations
  - name: Sectors
    description: Sector-level operations
  - name: Cells
    description: Cell-level operations
  - name: Villages
    description: Village-level operations

components:
  schemas:
    Country:
      type: object
      properties:
        id:
          type: integer
          example: 4
        name:
          type: string
          example: Rwanda
      required:
        - id
        - name

    Province:
      type: object
      properties:
        id:
          type: integer
          example: 21
        name:
          type: string
          example: Eastern Province
        country:
          type: integer
          example: 4
      required:
        - id
        - name
        - country

    District:
      type: object
      properties:
        id:
          type: integer
          example: 121
        name:
          type: string
          example: Bugesera
        province:
          type: integer
          example: 21
      required:
        - id
        - name
        - province

    Sector:
      type: object
      properties:
        id:
          type: integer
          example: 1421
        name:
          type: string
          example: Gashora
        district:
          type: integer
          example: 121
      required:
        - id
        - name
        - district

    Cell:
      type: object
      properties:
        id:
          type: integer
          example: 2587
        name:
          type: string
          example: Biryogo
        sector:
          type: integer
          example: 1421
      required:
        - id
        - name
        - sector

    Village:
      type: object
      properties:
        id:
          type: integer
          example: 622
        name:
          type: string
          example: Bigaga
        cell:
          type: integer
          example: 2684
      required:
        - id
        - name
        - cell

    PaginatedResponse:
      type: object
      properties:
        count:
          type: integer
          description: Total number of items
          example: 416
        next:
          type: string
          nullable: true
          description: URL to next page
          example: https://rwanda-administrative-structure-api.onrender.com/api/sectors/?page=2
        previous:
          type: string
          nullable: true
          description: URL to previous page
          example: null
        results:
          type: array
          description: Array of items for current page

    Error:
      type: object
      properties:
        error:
          type: string
          example: Invalid filter parameter

  parameters:
    PageParam:
      name: page
      in: query
      description: Page number
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      description: Number of items per page (max 1000)
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    SearchParam:
      name: search
      in: query
      description: Search by name (case-insensitive, partial matches)
      schema:
        type: string

paths:
  /api/countries/:
    get:
      tags:
        - Countries
      summary: List all countries
      description: Returns a list of all countries in the system
      parameters:
        - $ref: '#/components/parameters/SearchParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/Country'
              example:
                count: 1
                next: null
                previous: null
                results:
                  - id: 4
                    name: Rwanda

  /api/countries/{id}/:
    get:
      tags:
        - Countries
      summary: Get country by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Country ID
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Country'
        '404':
          description: Country not found

  /api/provinces/:
    get:
      tags:
        - Provinces
      summary: List provinces
      description: Returns all provinces, can be filtered by country
      parameters:
        - name: country
          in: query
          description: Filter by country ID
          schema:
            type: integer
            example: 4
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/Province'
              example:
                count: 5
                next: null
                previous: null
                results:
                  - id: 21
                    name: Eastern Province
                    country: 4
                  - id: 22
                    name: Kigali City
                    country: 4

  /api/provinces/{id}/:
    get:
      tags:
        - Provinces
      summary: Get province by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Province ID
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Province'

  /api/districts/:
    get:
      tags:
        - Districts
      summary: List districts
      description: Returns all districts, can be filtered by province
      parameters:
        - name: province
          in: query
          description: Filter by province ID
          schema:
            type: integer
            example: 21
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/District'
              example:
                count: 7
                next: null
                previous: null
                results:
                  - id: 121
                    name: Bugesera
                    province: 21
                  - id: 125
                    name: Gatsibo
                    province: 21

  /api/districts/{id}/:
    get:
      tags:
        - Districts
      summary: Get district by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: District ID
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/District'

  /api/sectors/:
    get:
      tags:
        - Sectors
      summary: List sectors
      description: Returns all sectors, can be filtered by district
      parameters:
        - name: district
          in: query
          description: Filter by district ID
          schema:
            type: integer
            example: 121
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/Sector'
              example:
                count: 416
                next: https://rwanda-administrative-structure-api.onrender.com/api/sectors/?page=2
                previous: null
                results:
                  - id: 1421
                    name: Gashora
                    district: 121

  /api/sectors/{id}/:
    get:
      tags:
        - Sectors
      summary: Get sector by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Sector ID
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sector'

  /api/cells/:
    get:
      tags:
        - Cells
      summary: List cells
      description: Returns all cells, can be filtered by sector
      parameters:
        - name: sector
          in: query
          description: Filter by sector ID
          schema:
            type: integer
            example: 1421
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/Cell'

  /api/cells/{id}/:
    get:
      tags:
        - Cells
      summary: Get cell by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Cell ID
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cell'

  /api/villages/:
    get:
      tags:
        - Villages
      summary: List villages
      description: Returns all villages, can be filtered by cell
      parameters:
        - name: cell
          in: query
          description: Filter by cell ID
          schema:
            type: integer
            example: 2684
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/Village'
              example:
                count: 14840
                next: https://rwanda-administrative-structure-api.onrender.com/api/villages/?page=2
                previous: null
                results:
                  - id: 622
                    name: Bigaga
                    cell: 2684

  /api/villages/{id}/:
    get:
      tags:
        - Villages
      summary: Get village by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Village ID
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Village'

  /admin/:
    get:
      summary: Django Admin Interface
      description: Access the Django administrative interface (requires authentication)
      responses:
        '200':
          description: Admin interface
        '302':
          description: Redirects to login page

  /admin/login/:
    get:
      summary: Admin Login
      description: Login page for Django admin interface
      responses:
        '200':
          description: Login page

